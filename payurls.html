<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>就不给你冲</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html, body {
            height: 100%;
            font-family: "Microsoft YaHei", "SimHei", sans-serif;
            overflow: hidden;
        }
        body {
            background: url("/picture/bg.jpg") no-repeat center center;
            background-size: cover;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px;
        }
        .mask {
            position: fixed;
            inset: 0;
            background-color: rgba(0, 0, 0, 0.35);
            z-index: 1;
        }
        .info-card {
            position: relative;
            z-index: 2;
            max-width: 560px;
            width: 100%;
            background-color: rgba(0, 0, 0, 0.88);
            border: 1px solid rgba(212, 160, 74, 0.65);
            border-radius: 12px;
            padding: 32px;
            color: #f5e9cc;
            box-shadow: 0 0 25px rgba(0, 0, 0, 0.8);
            line-height: 2;
            text-align: center;
        }
        .info-card h2 {
            color: #ffdd77;
            margin-bottom: 24px;
            font-size: 24px;
            font-weight: bold;
            text-shadow:
                0 0 4px #000,
                0 0 8px rgba(255, 221, 119, 0.8),
                0 0 12px rgba(255, 221, 119, 0.6);
            letter-spacing: 2px;
        }
        .info-card p {
            font-size: 16px;
            margin-bottom: 16px;
            text-indent: 0;
            text-shadow:
                1px 1px 2px #000,
                0 0 4px rgba(0, 0, 0, 0.8);
        }
        .info-card p:last-of-type {
            margin-bottom: 0;
        }
        .highlight {
            color: #ff4444;
            font-weight: bold;
            text-shadow:
                0 0 4px #000,
                0 0 8px rgba(255, 68, 68, 0.8),
                0 0 12px rgba(255, 68, 68, 0.6);
        }
        .gold {
            color: #ffdd77;
            font-weight: bold;
            text-shadow:
                0 0 4px #000,
                0 0 8px rgba(255, 221, 119, 0.8),
                0 0 12px rgba(255, 221, 119, 0.6);
        }
        .contact {
            margin-top: 24px;
            padding-top: 20px;
            border-top: 1px solid rgba(212, 160, 74, 0.5);
            font-size: 15px;
            text-shadow:
                1px 1px 2px #000,
                0 0 4px rgba(0, 0, 0, 0.8);
        }
        @media screen and (max-width: 768px) {
            body {
                padding: 20px;
            }
            .info-card {
                padding: 22px;
            }
            .info-card h2 {
                font-size: 20px;
            }
        }
    </style>
</head>
<body>
<div class="mask"></div>
<div class="info-card">
    <h2>再劝你一次</h2>

    <p><span class="highlight">不要充值，不要充值，不要充值</span></p>
    <p><span class="highlight">不让你充值你乱点个什么东东😡</span></p>

    <p>游戏轻松获得元宝，上线就送元宝和灵符，基本够用了</p>

    <p>打怪爆金币，元宝，灵符，高级装备，爆率超高</p>

    <p>打到的金币再换元宝，元宝再换灵符，紧吧点，日子能过</p>

    <p>打到的装备再 <span class="gold">回收</span>，直接给元宝，灵符，金币，经验，去打吧</p>

    <p>你是懒人？土豪？当我没说。那加我吧。</p>

    <div class="contact">
        <p>管理QQ：<span class="gold">180270169</span></p>
        <p>充值比例 <span class="gold">1：1000</span></p>
    </div>
</div>
</body>
</html>
